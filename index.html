<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rayz Official - Pembayaran</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0e0e0e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1a1a1a;
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 800px;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #fff;
      font-weight: 600;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .payment-methods {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
    }

    .payment-card {
      background: #000;
      border-radius: 15px;
      padding: 20px;
      width: 220px;
      position: relative;
      overflow: hidden;
      z-index: 0;
    }

    .payment-card::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, #ff4d4d, #ffcc00, #33cc33, #33cccc, #3366ff, #cc33cc, #ff4d4d);
      background-size: 400% 400%;
      border-radius: 15px;
      z-index: -1;
      animation: borderGlow 10s linear infinite;
    }

    .payment-card::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px; right: 2px; bottom: 2px;
      background: #000;
      border-radius: 13px;
      z-index: -1;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .payment-icon {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: #4da6ff;
    }

    .payment-name {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 1.2rem;
      color: #fff;
    }

    .payment-number {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 15px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 1rem;
      color: #ccc;
    }

    .copy-button {
      margin-top: 10px;
      background: #333;
      color: #ddd;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .copy-button:hover {
      background: #555;
    }

    .copy-button i {
      font-size: 1.2rem;
    }

    .qris-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .qris-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #eee;
    }

    .qris-image {
      max-width: 220px;
      border-radius: 15px;
      margin: 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .note {
      margin-top: 25px;
      font-size: 0.9rem;
      color: rgba(220, 220, 220, 0.8);
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 2rem;
      }

      .payment-methods {
        flex-direction: column;
        align-items: center;
      }

      .payment-card {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="https://files.catbox.moe/icvznl.png" alt="Rayz Official Logo"/>
    </div>
    <h1>Metode Pembayaran</h1>

    <div class="payment-methods">
      <div class="payment-card">
        <div class="payment-icon"><i class="fas fa-wallet"></i></div>
        <div class="payment-name">DANA</div>
        <div class="payment-number" id="dana-number">085602574511</div>
        <button class="copy-button" onclick="copyToClipboard('dana-number')">
          <i class="fas fa-copy"></i> Salin
        </button>
      </div>

      <div class="payment-card">
        <div class="payment-icon"><i class="fab fa-google-pay"></i></div>
        <div class="payment-name">GOPAY</div>
        <div class="payment-number" id="gopay-number">085602574511</div>
        <button class="copy-button" onclick="copyToClipboard('gopay-number')">
          <i class="fas fa-copy"></i> Salin
        </button>
      </div>

      <div class="payment-card">
        <div class="payment-icon"><i class="fas fa-mobile-alt"></i></div>
        <div class="payment-name">OVO</div>
        <div class="payment-number" id="ovo-number">0857*****</div>
        <button class="copy-button" onclick="copyToClipboard('ovo-number')">
          <i class="fas fa-copy"></i> Salin
        </button>
      </div>
    </div>

    <div class="qris-section">
      <div class="qris-title">Atau Scan QRIS</div>
      <img src="https://files.catbox.moe/p1725x.png" alt="QRIS Payment" class="qris-image"/>
      <div class="note">
        <p>Setelah melakukan pembayaran, harap konfirmasi dengan mengirimkan bukti transfer ke admin.</p>
        <p>Terima kasih telah berbelanja di Rayz Official!</p>
      </div>
    </div>
  </div>

  <script>
    function copyToClipboard(id) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("Nomor berhasil disalin: " + text);
      }).catch(err => {
        alert("Gagal menyalin: " + err);
      });
    }
  </script>
</body>
</html>
