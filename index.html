<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayz Official - Pembayaran</title>
    <link rel="stylesheet" href="styles.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://img1.pixhost.to/images/5425/593946512_oyamaofficial.jpg" alt="Logo" class="Logo">
        </div>
        
        <h1>Metode Pembayaran</h1>
        
        <div class="payment-methods">
            <div class="payment-card">
                <div class="payment-icon">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="payment-name">DANA</div>
                <div class="payment-number">085602574511</div>
                <button class="copy-button" data-number="085602574511">
                    <i class="fas fa-copy"></i> Salin
                </button>
            </div>
            
            <div class="payment-card">
                <div class="payment-icon">
                    <i class="fab fa-google-pay"></i>
                </div>
                <div class="payment-name">GOPAY</div>
                <div class="payment-number">085602574511</div>
                <button class="copy-button" data-number="085602574511">
                    <i class="fas fa-copy"></i> Salin
                </button>
            </div>
            
            <div class="payment-card">
                <div class="payment-icon">
                    <i class="fas fa-mobile-alt"></i>
                </div>
                <div class="payment-name">OVO</div>
                <div class="payment-number">0857*****</div>
                <button class="copy-button" data-number="0857*****">
                    <i class="fas fa-copy"></i> Salin
                </button>
            </div>
        </div>
        
        <div class="qris-section">
            <div class="qris-title">Atau Scan QRIS</div>
            <img src="https://files.catbox.moe/p1725x.png" alt="QRIS Payment" class="qris-image">
            <div class="note">
                <p>Setelah melakukan pembayaran, harap konfirmasi dengan mengirimkan bukti transfer ke admin.</p>
                <p>Terima kasih telah berbelanja di Rayz Official!</p>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.copy-button').forEach(button => {
            button.addEventListener('click', () => {
                const number = button.getAttribute('data-number');
                navigator.clipboard.writeText(number).then(() => {
                    button.innerHTML = '<i class="fas fa-check"></i> Disalin!';
                    setTimeout(() => {
                        button.innerHTML = '<i class="fas fa-copy"></i> Salin';
                    }, 2000);
                });
            });
        });
    </script>
</body>
</html>
